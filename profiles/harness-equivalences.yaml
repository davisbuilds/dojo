# WHY: these pairs stay undeclared on purpose. A wrong declaration silently
# removes a skill the maintainer selected, while an undeclared collision is
# reported, so a pair is declared only for a same-capability match.
#   * `skill-creator`: dojo's standalone creator is the selected authoring
#     capability on both harnesses; a listed native copy is a collision to
#     report, not permission to remove it.
#   * `gemini-imagen` against Codex's `imagegen`: the Gemini multi-image path is
#     a separate capability, so suppressing it would remove one.
#   * `gpt-imagen` against Codex's `imagegen`: dojo's copy pins `gpt-image-2` and
#     exposes inpainting, masking and batch output, which the bundled
#     description does not claim.
#   * `local-review` against Codex's `.system/review-agent`: close capabilities
#     under different names, and `local-review` is a `core` member, so a wrong
#     call empties part of the baseline.
version: 1
equivalences:
  - skill: skill-installer
    harness: codex
    bundled_entry: skill-installer
    evidence: >-
      Observed at ~/.codex/skills/.system/skill-installer/SKILL.md and listed in
      tests/fixtures/profiles/codex-prompt-input-dojo-2026-08-02.json. Same name,
      same capability (install skills from a curated list or a GitHub repo path,
      private repos included); the bundled copy writes to $CODEX_HOME/skills.
