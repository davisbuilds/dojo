harness: claude-code
harness_version: 2.1.220
model: haiku-200k

unit: characters
limit: 8000
context_window: 200000
window_field: context_window

estimator: >-
  Identical to the 1M policy: rendered character count, compared characters to
  characters, no token conversion.
provenance: >-
  Claude Code bundle v2.1.220 constants, confirmed live by
  `claude --debug-file`: "75 skills, 23287 chars > 8000 budget".
limit_basis: vendor-corroborated
# WHY: no declared_surfaces, because no per-entry-point rendering split has been
# observed for Claude Code and its probe reads captured request bodies, the
# effective surface. Add one the moment a split is observed.
measured: 2026-08-02
probe: claude -p --no-session-persistence --model haiku --debug-file <path> "say ok"

# WHY: nobody runs this pair, so it is scored and reported but never gates; a
# suite should not fail for a path in nobody's use.
deployable: false

shadows_by_name: true
project_scope_root: .claude/skills
