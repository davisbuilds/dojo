# DECLARED, NOT DEPLOYABLE (spec revision 11).
#
# The limit here is every bit as authoritative as the 1M policy's — same vendor
# constants, same probe. What differs is that nobody runs this pair. It is
# scored and reported so a session that does land here is told it is
# non-conformant, and it never gates, so a suite does not fail for a path in
# nobody's use.
#
# Promoting it is a visible edit to `deployable` below, not a consequence of
# someone selecting a different model. Demand does not move with the window —
# only the budget does — so the same measurements score against both policies.
harness: claude-code
harness_version: 2.1.220
model: haiku-200k

unit: characters
limit: 8000
context_window: 200000
window_field: context_window

estimator: >-
  Identical to the 1M policy: rendered character count, compared characters to
  characters, no token conversion.
provenance: >-
  Claude Code bundle v2.1.220 constants, confirmed live by
  `claude --debug-file`: "75 skills, 23287 chars > 8000 budget".
limit_basis: vendor-corroborated  # bundle constant, corroborated by a render of 8,058 chars against the 8,000 budget
# No declared_surfaces: no per-entry-point rendering split has been observed for
# Claude Code, and its probe reads captured request bodies (OTEL_LOG_RAW_API_BODIES)
# — the effective surface by construction. That is precisely why its figures
# survived 2026-08-04 unchanged while every Codex figure did not. An empty
# declaration accepts any surface; add one the moment a split is observed.
measured: 2026-08-02
probe: claude -p --no-session-persistence --model haiku --debug-file <path> "say ok"

deployable: false

shadows_by_name: true
project_scope_root: .claude/skills
