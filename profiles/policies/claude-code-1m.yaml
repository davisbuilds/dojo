harness: claude-code
harness_version: 2.1.220
model: opus-1m

# WHY: characters end to end; converting to tokens would introduce an error the
# harness itself never makes.
unit: characters
limit: 40000
context_window: 1000000
window_field: context_window

estimator: >-
  Rendered `- {name}: {description}` character count plus a newline, compared
  characters to characters. skillListingBudgetFraction defaults to 0.01 and
  skillListingMaxDescChars to 1536.
provenance: >-
  Claude Code bundle v2.1.220 constants, confirmed live by
  `claude --debug-file`, which states the budget verdict outright.
limit_basis: vendor-corroborated
# WHY: no declared_surfaces, because no per-entry-point rendering split has been
# observed for Claude Code and its probe reads captured request bodies, the
# effective surface. Add one the moment a split is observed.
measured: 2026-08-02
probe: claude -p --no-session-persistence --model <model> --debug-file <path> "say ok"

# WHY: the operator runs 1M sessions, so this pair gates.
deployable: true

# WHY: Claude Code deduplicates by name across scopes (a dojo session loads 94
# and sends 75) and Codex does not, so this is policy data rather than a rule in
# the observation code.
shadows_by_name: true
project_scope_root: .claude/skills
