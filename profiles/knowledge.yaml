# Reviewed data. Changing `members` changes profile identity — see profiles/README.md.
name: knowledge
kind: overlay
description: >-
  Turning what a session learned into something a later session can find:
  capture it, then write it where it will be read. `handoff` is deliberately
  absent — SC-03 already records that `session-retro` covers the adjacent need
  at 14 observed sessions against `handoff`'s 2, so including it here would
  reintroduce by the side door what the baseline removed on evidence.
  `obsidian-bases` and `obsidian-canvas` are excluded as alternate vault file
  formats rather than an additional capability; `obsidian-markdown` is the one
  that every vault note goes through.
members:
  - compound-docs      # session-retro's counterpart: durable, categorized capture of a solved problem for later retrieval
  - obsidian-markdown  # SC-02 anchor
  - session-retro      # SC-02 anchor
