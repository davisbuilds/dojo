# Reviewed data. Changing `members` changes profile identity — see profiles/README.md.
name: skill-authoring
kind: overlay
description: >-
  Authoring a skill and keeping it useful: create it, select appropriate checks,
  and maintain canonical copies. Dojo's standalone `skill-creator` remains
  selected on both harnesses; native alternatives do not suppress it.
  `template` is excluded as a scaffold `skill-creator` already emits;
  `skill-installer` is a distribution action rather than an authoring one — and
  is itself Codex-bundled; `audit-skill` is third-party trust screening at
  install time, not authoring.
members:
  - skill-creator       # SC-02 anchor
  - skill-evals         # packaging, lexical routing checks, and outcome-evidence guidance
  - skill-standardizer  # SC-02 anchor
