[project]
name = "dojo"
version = "0.3.0"
description = "Agent skills, hooks, and checkout-based development tools"
requires-python = ">=3.11"
dependencies = [
    "pyyaml==6.0.3",
    "typer>=0.29.1,<1",
    "rich>=15,<16",
]

[dependency-groups]
dev = ["pytest>=9.2.0,<10"]

[tool.uv]
# WHY: supply-chain quarantine. For an urgent fix, override one package with
# exclude-newer-package instead of lowering this.
exclude-newer = "7 days"
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
