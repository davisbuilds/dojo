[project]
name = "dojo"
version = "0.2.0"
description = "Agent skills, hooks, and checkout-based development tools"
requires-python = ">=3.11"
dependencies = [
    "pyyaml==6.0.3",
    "typer>=0.27.2,<1",
    "rich>=15,<16",
]

[dependency-groups]
dev = ["pytest>=9.1.1,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
