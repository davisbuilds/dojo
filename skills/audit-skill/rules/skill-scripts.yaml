rules:
  - id: skill-audit.python-eval-exec
    pattern-either:
      - pattern: eval($ARG)
      - pattern: exec($ARG)
    message: Python code evaluation; investigate input control and effective authority.
    languages: [python]
    severity: WARNING
  - id: skill-audit.python-shell
    pattern-either:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
      - pattern: os.system($CMD)
      - pattern: os.popen($CMD)
    message: Shell interpretation; investigate command construction and input control.
    languages: [python]
    severity: WARNING
  - id: skill-audit.python-credential-literal
    patterns:
      - pattern: $KEY = "..."
      - metavariable-regex:
          metavariable: $KEY
          regex: "(?i).*(api_key|apikey|api_secret|secret_key|auth_token|private_key|access_key).*"
    message: Credential-like assignment; inspect whether it is a real secret without copying its value.
    languages: [python]
    severity: WARNING
  - id: skill-audit.python-runtime-install
    pattern-either:
      - pattern: subprocess.$FUNC(["pip", "install", ...], ...)
      - pattern: subprocess.$FUNC(["pip3", "install", ...], ...)
      - pattern: subprocess.$FUNC(["npm", "install", ...], ...)
    message: Runtime package installation; investigate provenance, version pinning, and authorization.
    languages: [python]
    severity: WARNING
