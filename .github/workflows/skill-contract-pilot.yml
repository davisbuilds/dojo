name: Skill Contract Strict Set

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pilot:
    name: Validate Strict Skill Set
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.5'
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Classify retained commits for release automation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DOJO_PR_TITLE: ${{ github.event.pull_request.title }}
          DOJO_PR_BODY: ${{ github.event.pull_request.body }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            uv run --locked python scripts/check_commit_subjects.py "$base" "$HEAD_SHA"
          else
            uv run --locked python scripts/check_commit_subjects.py "$EVENT_BEFORE" "$GITHUB_SHA"
            uv run --locked python scripts/check_commit_subjects.py --unreleased "$GITHUB_SHA"
          fi

      - name: Resolve version-bump base
        id: base
        # Pass event fields through env rather than interpolating ${{ ... }} into
        # the run block: a branch name is attacker-influenced on PRs, so template
        # expansion here is a code-injection vector (zizmor template-injection).
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            echo "ref=origin/${BASE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${EVENT_BEFORE}" >> "$GITHUB_OUTPUT"
          fi

      # The same gate AGENTS.md documents for pre-push; checks live in the script.
      - name: Run repository gate
        env:
          CHECK_BASE: ${{ steps.base.outputs.ref }}
        run: scripts/check

      - name: Write strict set report
        if: always()
        run: |
          uv run --locked python3 skills/skill-evals/scripts/validate_skill_contract.py \
            --skills-root skills --strict > strict-skill-contract-summary.txt || true
          uv run --locked python3 skills/skill-evals/scripts/validate_skill_contract.py \
            --skills-root skills --strict --json > strict-skill-contract-report.json || true

      - name: Upload strict set report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strict-skill-contract-report
          path: |
            strict-skill-contract-report.json
            strict-skill-contract-summary.txt
